<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POINTWINA</title>
  <link rel="stylesheet" href="style.css">
</head>
<!-- BET SLIP -->
<div id="betSlip" class="bet-slip">
  <h3>🧾 Bet Slip</h3>

  <p id="selectedBet">No selection yet.</p>

  <p>Stake: <strong>100 virtual points</strong></p>

  <button onclick="confirmBet()">Place Bet</button>
  <button onclick="closeBetSlip()">Cancel</button>
</div>
<body>

  <header>
    <div class="logo">POINTWINA</div>
    <p>Play • Predict • Win</p>
  </header>

  <main>

    <section class="balance">
      <p>Virtual Wallet</p>
      <h2 id="balance">10,000 POINTS</h2>
      <button onclick="addPoints()">+ Add Demo Points</button>
    </section>

    <section class="section">
      <h2>Games</h2>

      <div class="cards">

        <div class="card">
  <div class="football-matches">
    <h3>⚽ Today's Matches</h3>

    <p>Arsenal vs Tottenham</p>

    <div class="bet-options">
      <button onclick="placeDemoBet('Arsenal Win')">
        Arsenal <small>1.85</small>
      </button>

      <button onclick="placeDemoBet('Draw')">
        Draw <small>3.40</small>
      </button>

      <button onclick="placeDemoBet('Tottenham Win')">
        Tottenham <small>4.20</small>
      </button>
    </div>
  </div>

  <span>⚽</span>
  Football
  <small>Predictions</small>
        </div>

        <button class="card" onclick="placeDemoBet('Aviator')">
          <span>✈️</span>
          Aviator
          <small>Demo Game</small>
        </button>

        <button class="card" onclick="placeDemoBet('Casino')">
          <span>🎰</span>
          Casino
          <small>Demo Games</small>
        </button>

        <button class="card" onclick="placeDemoBet('Spin & Win')">
          <span>🎯</span>
          Spin & Win
          <small>Demo Game</small>
        </button>

      </div>
    </section>

    <section class="section">
      <h2>Quick Access</h2>

      <a class="button" href="#" onclick="showBalance(); return false;">
        💰 My Wallet
      </a>

      <a class="button" href="#" onclick="alert('Promotions coming soon!'); return false;">
        🎁 Promotions
      </a>

      <a class="button" href="#" onclick="alert('Account section coming soon!'); return false;">
        👤 My Account
      </a>
    </section>

  </main>

  <footer>
    POINTWINA Demo
    <br>
    Virtual points only
  </footer>

  <script src="script.js"></script>

</body>
</html>
