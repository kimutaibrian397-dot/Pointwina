<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POINTWINA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    header {
      padding: 20px;
      background: #111;
      border-bottom: 1px solid #333;
      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      color: #ffd000;
    }

    .balance {
      margin: 20px;
      padding: 20px;
      background: #151515;
      border-radius: 15px;
      border: 1px solid #333;
    }

    .balance h2 {
      color: #ffd000;
      margin-top: 8px;
    }

    .section {
      padding: 20px;
    }

    .section h2 {
      margin-bottom: 15px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      padding: 25px 15px;
      background: #151515;
      border: 1px solid #333;
      border-radius: 15px;
      text-align: center;
      font-weight: bold;
    }

    .card span {
      display: block;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .button {
      display: block;
      margin-top: 20px;
      padding: 15px;
      background: #ffd000;
      color: #000;
      text-align: center;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      text-align: center;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">POINTWINA</div>
    <p>Play • Predict • Win</p>
  </header>

  <div class="balance">
    <p>Virtual Wallet</p>
    <h2>10,000 POINTS</h2>
  </div>

  <div class="section">
    <h2>Games</h2>

    <div class="cards">
      <div class="card">
        <span>⚽</span>
        Football
      </div>

      <div class="card">
        <span>✈️</span>
        Aviator Demo
      </div>

      <div class="card">
        <span>🎰</span>
        Casino Demo
      </div>

      <div class="card">
        <span>🎯</span>
        Spin & Win
      </div>
    </div>

    <a class="button" href="#">Explore POINTWINA</a>
  </div>

  <footer>
    POINTWINA Demo — Virtual points only
  </footer>

</body>
</html>
